spring:
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: 
              - "http://localhost:4200"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
            allowedHeaders: "*"
            allowCredentials: true
      discovery:
        locator:
          enabled: true
      routes:
        - id: catalog
          uri: http://localhost:8090
          predicates:
            - RemoteAddr=127.0.0.1/32,192.168.0.0/16
            - Path=/product/**, /category/**
          filters:
            - AuthFilter

        - id: report
          uri: http://localhost:8091
          predicates:
            - Path=/productReport/**, /log/**
          filters:
            - AuthFilter

        - id: auth
          uri: http://localhost:8092
          predicates:
            - Path=/verif/**

eureka:
  client:
    register-with-eureka: true

server:
  port: 8080